<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Weather Finder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --primary: #38bdf8;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 1.75rem;
      text-align: center;
      margin-bottom: 1.5rem;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    input {
      flex: 1;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      text-transform: uppercase;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .error {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      text-align: center;
      display: none;
    }

    .weather-result {
      display: none;
      text-align: center;
      margin-top: 1rem;
    }

    .location {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .temp {
      font-size: 3.5rem;
      font-weight: 800;
      margin: 0.5rem 0;
      color: #ffffff;
    }

    .condition {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color: var(--primary);
    }

    .details {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1.25rem;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
    }

    .detail-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .detail-value {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>UK Weather Lookup</h1>
    
    <div class="search-box">
      <input type="text" id="postcode" placeholder="e.g. SW1A 1AA" autofocus />
      <button onclick="getWeather()">Search</button>
    </div>

    <div id="error" class="error"></div>

    <div id="weather" class="weather-result">
      <div id="location" class="location"></div>
      <div id="temp" class="temp">--°C</div>
      <div id="condition" class="condition">--</div>
      
      <div class="details">
        <div class="detail-item">
          <span class="detail-label">Humidity</span>
          <span id="humidity" class="detail-value">--%</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Wind Speed</span>
          <span id="wind" class="detail-value">-- mph</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const weatherCodes = {
      0: "Clear sky",
      1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
      45: "Fog", 48: "Depositing rime fog",
      51: "Light drizzle", 53: "Moderate drizzle", 55: "Dense drizzle",
      61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
      71: "Slight snow", 73: "Moderate snow", 75: "Heavy snow",
      80: "Slight rain showers", 81: "Moderate rain showers", 82: "Violent rain showers",
      95: "Thunderstorm"
    };

    async function getWeather() {
      const input = document.getElementById('postcode').value.trim();
      const errorEl = document.getElementById('error');
      const weatherEl = document.getElementById('weather');

      errorEl.style.display = 'none';
      weatherEl.style.display = 'none';

      if (!input) {
        showError("Please enter a valid UK postcode.");
        return;
      }

      try {
        // Step 1: Geocode Postcode (postcodes.io API)
        const postcodeRes = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(input)}`);
        const postcodeData = await postcodeRes.json();

        if (postcodeData.status !== 200) {
          showError("Postcode not found. Please check and try again.");
          return;
        }

        const { latitude, longitude, admin_district, parish } = postcodeData.result;
        const locationName = `${parish || admin_district || 'UK Location'}`;

        // Step 2: Fetch Live Weather (Open-Meteo API)
        const weatherRes = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=mph`
        );
        const weatherData = await weatherRes.json();
        const current = weatherData.current;

        // Step 3: Display Results
        document.getElementById('location').innerText = `${input.toUpperCase()} (${locationName})`;
        document.getElementById('temp').innerText = `${Math.round(current.temperature_2m)}°C`;
        document.getElementById('condition').innerText = weatherCodes[current.weather_code] || "Variable";
        document.getElementById('humidity').innerText = `${current.relative_humidity_2m}%`;
        document.getElementById('wind').innerText = `${Math.round(current.wind_speed_10m)} mph`;

        weatherEl.style.display = 'block';
      } catch (err) {
        showError("An error occurred while fetching data. Check your connection.");
      }
    }

    function showError(msg) {
      const errorEl = document.getElementById('error');
      errorEl.innerText = msg;
      errorEl.style.display = 'block';
    }

    document.getElementById('postcode').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') getWeather();
    });
  </script>
</body>
</html>
